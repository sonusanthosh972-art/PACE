<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <style>
      /*
        PACE wordmark. A, C and E are Inter SemiBold outlines (the app's own typeface), so the
        logo looks the same on every device without loading a font. Cap height matches the
        P mark (y 190 to 310) and the letters sit 12px apart:
        - P (icon): rests at x 267 to 369 after sliding left
        - A: 381 to 493   C: 505 to 611   E: 623 to 701
      */

      /* 1. THE 'P' ICON: starts dead-centre (x=500), glides left. */
      .p-icon {
        animation: slideP 4.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }

      /* 2. LETTERS 'A', 'C', 'E': emerge from deep Z-space (behind the screen). */
      .char-a {
        animation: emergeA 4.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 437px 250px;
      }
      .char-c {
        animation: emergeC 4.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 558px 250px;
      }
      .char-e {
        animation: emergeE 4.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 662px 250px;
      }

      @keyframes slideP {
        0%, 25%   { transform: translateX(0px) scale(1.08); }
        48%, 85%  { transform: translateX(-185px) scale(1); }
        95%, 100% { transform: translateX(0px) scale(1.08); }
      }

      @keyframes emergeA {
        0%, 26% {
          transform: translate(65px, 8px) scale(0.25);
          opacity: 0;
          filter: blur(12px);
        }
        46%, 85% {
          transform: translate(0px, 0px) scale(1);
          opacity: 1;
          filter: blur(0px);
        }
        94%, 100% {
          transform: translate(65px, 8px) scale(0.25);
          opacity: 0;
          filter: blur(12px);
        }
      }

      @keyframes emergeC {
        0%, 29% {
          transform: translate(-55px, 8px) scale(0.25);
          opacity: 0;
          filter: blur(14px);
        }
        49%, 85% {
          transform: translate(0px, 0px) scale(1);
          opacity: 1;
          filter: blur(0px);
        }
        94%, 100% {
          transform: translate(-55px, 8px) scale(0.25);
          opacity: 0;
          filter: blur(14px);
        }
      }

      @keyframes emergeE {
        0%, 32% {
          transform: translate(-170px, 8px) scale(0.25);
          opacity: 0;
          filter: blur(16px);
        }
        52%, 85% {
          transform: translate(0px, 0px) scale(1);
          opacity: 1;
          filter: blur(0px);
        }
        94%, 100% {
          transform: translate(-170px, 8px) scale(0.25);
          opacity: 0;
          filter: blur(16px);
        }
      }
    </style>

    <!-- Brushed Platinum Fill (no pure white, per the app palette) -->
    <linearGradient id="platinum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Volt Emerald Slit Stem Fill -->
    <linearGradient id="emerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10E896" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Transparent: the screen behind supplies the background (#16171A, the app's bg). -->

  <g class="char-a">
    <path fill="url(#platinum)" d="M404.5 310L381 310L422.9 190L450.2 190L493.0 310L469.4 310L448.1 247.7Q444.9 238 441.6 225.8Q438.2 213.6 434.1 198.1L434.1 198.1L438.6 198.1Q434.6 213.8 431.3 226.0Q428.0 238.3 425.1 247.7L425.1 247.7L404.5 310ZM468.6 280.3L405.4 280.3L405.4 263.0L468.6 263.0L468.6 280.3Z" />
  </g>

  <g class="char-c">
    <path fill="url(#platinum)" d="M560.0 311.6L560.0 311.6Q544.2 311.6 531.8 304.3Q519.4 297.0 512.2 283.2Q505.0 269.4 505.0 250.1L505.0 250.1Q505.0 230.7 512.2 216.9Q519.4 203.0 531.9 195.7Q544.3 188.4 560.0 188.4L560.0 188.4Q569.8 188.4 578.4 191.2Q586.9 193.9 593.7 199.3Q600.4 204.7 604.7 212.4Q609.1 220.1 610.5 229.9L610.5 229.9L588.9 229.9Q587.8 224.6 585.3 220.4Q582.7 216.3 579.0 213.5Q575.2 210.6 570.4 209.1Q565.7 207.6 560.3 207.6L560.3 207.6Q550.4 207.6 542.8 212.6Q535.2 217.5 530.9 227.0Q526.6 236.5 526.6 250.1L526.6 250.1Q526.6 263.9 531.0 273.3Q535.3 282.7 542.9 287.5Q550.5 292.4 560.2 292.4L560.2 292.4Q565.6 292.4 570.3 290.9Q575.1 289.4 578.9 286.5Q582.7 283.7 585.3 279.5Q587.9 275.4 588.9 270.1L588.9 270.1L610.6 270.1Q609.4 278.7 605.3 286.2Q601.3 293.7 594.7 299.4Q588.1 305.2 579.3 308.4Q570.6 311.6 560.0 311.6Z" />
  </g>

  <g class="char-e">
    <path fill="url(#platinum)" d="M700.9 310L622.6 310L622.6 190L700.6 190L700.6 208.1L644.1 208.1L644.1 240.5L696.4 240.5L696.4 258.4L644.1 258.4L644.1 291.9L700.9 291.9L700.9 310Z" />
  </g>

  <!-- THE 'P' ICON MARK (starts centred at x=500, glides left) -->
  <g class="p-icon" transform-origin="500 250">
    <!-- 1. Volt Emerald Slit Stem (120px cap height: y=190 to y=310) -->
    <path d="M 452 198 L 478 186 L 478 310 L 452 322 Z" fill="url(#emerald)" filter="url(#glow)" />

    <!-- 2. Clean Geometric P-Bowl (separated from the stem by a 10px razor slit) -->
    <path d="M 488 186
             L 516 186
             A 38 38 0 0 1 554 224
             A 38 38 0 0 1 516 262
             L 488 262
             L 488 238
             L 514 238
             A 14 14 0 0 0 528 224
             A 14 14 0 0 0 514 210
             L 488 210 Z" fill="url(#platinum)" />
  </g>
</svg>
