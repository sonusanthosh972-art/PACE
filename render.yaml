# Render Blueprint: Paisa Pulse API (apps/api-node).
# Render dashboard → New → Blueprint → pick this repo. Secrets marked sync: false are entered there.
# The admin dashboard is hosted on Vercel (apps/admin), not here.
version: "1"

services:
  - type: web
    name: paisapulse-api
    runtime: node
    rootDir: apps/api-node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGODB_DATABASE
        value: paisapulse
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render generates a long random secret
      - key: ADMIN_API_KEY
        sync: false
