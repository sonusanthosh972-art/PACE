# Render Blueprint: Paisa Pulse API (apps/api-node).
# Render dashboard → New → Blueprint → pick this repo. Secrets marked sync: false are entered there.
# The admin dashboard is hosted on Vercel (apps/admin), not here.
version: "1"

services:
  - type: web
    name: paisapulse-api
    runtime: node
    rootDir: apps/api-node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      # The API pings its own public URL (RENDER_EXTERNAL_URL, set by Render) every 10 minutes so
      # the free instance never idles into sleep. Set to "false" on a paid always-on plan.
      - key: KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "10"
      - key: MONGODB_DATABASE
        value: paisapulse
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render generates a long random secret
      - key: ADMIN_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      # Password-reset and verification emails (https://resend.com). Without them, reset is off.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false # e.g. "Paisa Pulse <no-reply@yourdomain.com>" on a domain verified in Resend
      # Optional error reporting (https://sentry.io). Leave empty to turn it off.
      - key: SENTRY_DSN
        sync: false
